name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python3 -m compileall -q apkfast apkfast.py
      - name: Check CLI help
        run: |
          python3 apkfast.py --help
          python3 apkfast.py build --help
          python3 apkfast.py setup-libs --help
          python3 apkfast.py cache-export --help
          python3 apkfast.py cache-import --help
          python3 apkfast.py webp-install --help
          python3 apkfast.py lunasvg-install --help
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify example manifests are well-formed XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for manifest in Path("examples").glob("*/AndroidManifest.xml"):
              ET.parse(manifest)
              print("OK", manifest)
          PY
